<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA" class="logo" />
      <div class="header-text">
        <h1>Space Explorer</h1>
        <p class="tagline">Astronomy Picture of the Day</p>
      </div>
    </header>

    <section class="space-fact" aria-labelledby="factHeading">
      <h2 id="factHeading">Did You Know?</h2>
      <p id="spaceFact"></p>
    </section>

    <div class="filters">
      <label class="date-field">
        <span>Start date</span>
        <input type="date" id="startDate" />
      </label>
      <label class="date-field">
        <span>End date</span>
        <input type="date" id="endDate" />
      </label>
      <button type="button" id="getImagesBtn">Get Space Images</button>
    </div>

    <div id="gallery" class="gallery" aria-live="polite">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>

    <footer class="credit">
      Photos and descriptions from NASA’s Astronomy Picture of the Day.
    </footer>
  </div>

  <div id="imageModal" class="modal" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button type="button" id="modalClose" class="modal-close" aria-label="Close details">×</button>
      <div id="modalMedia" class="modal-media"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="modal-date"></p>
      <p id="modalExplanation" class="modal-explanation"></p>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
